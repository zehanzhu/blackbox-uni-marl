<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <filter id="sh2"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15"/></filter>
    <style>
      .t1{font:700 28px Arial,sans-serif;fill:#ffffff}
      .t2{font:400 14px Arial,sans-serif;fill:#cbd5e1}
      .sectionTitle{font:700 20px Arial,sans-serif;fill:#0f172a}
      .sectionDesc{font:400 13px Arial,sans-serif;fill:#64748b}
      .boxTitle{font:700 15px Arial,sans-serif;fill:#0f172a}
      .boxText{font:400 12px Arial,sans-serif;fill:#475569}
      .boxCode{font:400 11px monospace,sans-serif;fill:#334155}
      .note{font:400 12px Arial,sans-serif;fill:#64748b}
      .stepNum{font:700 20px Arial,sans-serif;fill:#ffffff}
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1280" height="720" fill="#f8fafc"/>

  <!-- 顶部标题栏 -->
  <rect x="0" y="0" width="1280" height="64" fill="#2563eb"/>
  <text x="40" y="42" class="t1">训练编排层 — MultiAgentsPPOTrainer</text>
  <text x="530" y="42" class="t2">负责 per-policy PPO 训练编排、grouped advantage 计算、多 trainer 协调</text>

  <!-- ======== 左侧：核心职责 ======== -->
  <rect x="30" y="85" width="600" height="340" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="55" y="115" class="sectionTitle">核心职责</text>

  <rect x="55" y="135" width="555" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="75" y="155" class="boxTitle">① Policy Trainer Registry</text>
  <text x="75" y="172" class="boxText">unique(policy) → RayPPOTrainer → ray_resource_pool 映射维护</text>

  <rect x="55" y="190" width="555" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="75" y="210" class="boxTitle">② UID-Grouped Rollout Advantage 计算</text>
  <text x="75" y="227" class="boxText">基于同一 uid 下 rollout.n 个 reward 计算 rollout_id → advantage（支持 GRPO）</text>

  <rect x="55" y="245" width="555" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="75" y="265" class="boxTitle">③ Per-Policy DataProto 分发</text>
  <text x="75" y="282" class="boxText">将 advantage-annotated policy_name → DataProto 分发到对应 RayPPOTrainer</text>

  <rect x="55" y="300" width="555" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="75" y="320" class="boxTitle">④ 训练调度与 Checkpoint 协调</text>
  <text x="75" y="337" class="boxText">跳过无 batch 的 policy · 每个 policy 独立 checkpoint · global step 对齐</text>

  <rect x="55" y="355" width="555" height="55" rx="6" fill="#fefce8" stroke="#fcd34d" stroke-width="1"/>
  <text x="75" y="378" class="boxTitle">关键设计决策</text>
  <text x="75" y="398" class="boxText">trainer 数量由 unique(policy) 决定（而非 role 数量）；共享 policy 的 roles 共用同一个 trainer 和 resource pool</text>

  <!-- ======== 右侧：Policy-Trainer 拓扑图 ======== -->
  <rect x="660" y="85" width="590" height="340" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="685" y="115" class="sectionTitle">Policy-Trainer 拓扑（示例：3 roles → 2 policies）</text>

  <!-- Role 层 -->
  <text x="700" y="155" class="note">MAS Roles</text>
  <rect x="700" y="165" width="90" height="36" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="745" y="188" text-anchor="middle" class="boxTitle">agent_1</text>

  <rect x="810" y="165" width="90" height="36" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="855" y="188" text-anchor="middle" class="boxTitle">agent_2</text>

  <rect x="920" y="165" width="90" height="36" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="965" y="188" text-anchor="middle" class="boxTitle">agent_3</text>

  <!-- 映射箭头 -->
  <line x1="745" y1="201" x2="680" y2="260" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="855" y1="201" x2="680" y2="260" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="965" y1="201" x2="1100" y2="260" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <text x="680" y="240" class="note">role → policy</text>

  <!-- Policy 层 -->
  <text x="630" y="285" class="note">Policies</text>
  <rect x="630" y="295" width="140" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
  <text x="700" y="320" text-anchor="middle" class="boxTitle">policy_1</text>

  <rect x="1050" y="295" width="140" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
  <text x="1120" y="320" text-anchor="middle" class="boxTitle">policy_2</text>

  <!-- Trainer 层 -->
  <line x1="700" y1="335" x2="700" y2="380" stroke="#d97706" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1120" y1="335" x2="1120" y2="380" stroke="#d97706" stroke-width="2" marker-end="url(#arr)"/>

  <text x="650" y="370" class="note">policy → trainer</text>

  <rect x="600" y="385" width="200" height="35" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="700" y="407" text-anchor="middle" class="boxTitle">RayPPOTrainer(policy_1)</text>

  <rect x="1020" y="385" width="200" height="35" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="1120" y="407" text-anchor="middle" class="boxTitle">RayPPOTrainer(policy_2)</text>

  <!-- 注意标注 -->
  <rect x="660" y="330" width="565" height="1" stroke="#e2e8f0"/>

  <!-- ======== 下半部分：Advantage 分配流程 ======== -->
  <rect x="30" y="445" width="1220" height="260" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="55" y="475" class="sectionTitle">Grouped Advantage → Per-Policy Batch 分配流程</text>

  <!-- Step 1 -->
  <rect x="55" y="500" width="280" height="90" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="195" y="525" text-anchor="middle" class="boxTitle">Step 1: 收集 Rollout Rewards</text>
  <text x="195" y="548" text-anchor="middle" class="boxCode">uid → rollout_0: reward_0</text>
  <text x="195" y="565" text-anchor="middle" class="boxCode">uid → rollout_1: reward_1</text>
  <text x="195" y="582" text-anchor="middle" class="boxCode">...</text>

  <!-- Arrow -->
  <line x1="335" y1="545" x2="385" y2="545" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="395" y="500" width="280" height="90" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="535" y="525" text-anchor="middle" class="boxTitle">Step 2: 计算 Advantage</text>
  <text x="535" y="548" text-anchor="middle" class="boxCode">group_advantages(</text>
  <text x="535" y="565" text-anchor="middle" class="boxCode">  [r0, r1, ..., r_n-1])</text>
  <text x="535" y="582" text-anchor="middle" class="boxCode">→ rollout_id → advantage</text>

  <!-- Arrow -->
  <line x1="675" y1="545" x2="725" y2="545" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="735" y="500" width="280" height="90" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="875" y="525" text-anchor="middle" class="boxTitle">Step 3: 附加到 Records</text>
  <text x="875" y="548" text-anchor="middle" class="boxCode">rollout_0 所有 records</text>
  <text x="875" y="565" text-anchor="middle" class="boxCode">→ advantage_0</text>
  <text x="875" y="582" text-anchor="middle" class="boxCode">跨所有 role + policy</text>

  <!-- Arrow -->
  <line x1="1015" y1="545" x2="1065" y2="545" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect x="1075" y="500" width="155" height="90" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="1152" y="525" text-anchor="middle" class="boxTitle">Step 4: PPO Update</text>
  <text x="1152" y="548" text-anchor="middle" class="boxCode">RayPPOTrainer</text>
  <text x="1152" y="565" text-anchor="middle" class="boxCode">(policy_1)</text>
  <text x="1152" y="582" text-anchor="middle" class="boxCode">(policy_2)</text>

  <!-- 底部补注 -->
  <rect x="55" y="615" width="1170" height="75" rx="8" fill="#fefce8" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="80" y="640" class="boxTitle">Per-Policy PPO Runtime 配置模式</text>
  <text x="80" y="662" class="boxCode">policies:</text>
  <text x="80" y="680" class="boxCode">  policy_1:</text>
  <text x="90" y="680" class="boxCode">ppo_trainer_config_name: ppo_trainer  ← compose 公开 config，再 merge overrides</text>

</svg>
