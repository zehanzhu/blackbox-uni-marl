<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Uni-Agent Multi-Agent Training Design Overview</title>
  <desc id="desc">Architecture diagram showing MultiAgentsPPOTrainer, MultiAgentFramework, OpenAICompatibleAgentFramework lifecycle alignment, role-aware serving runtime, external MAS, gateway actors, policy rollout backends, per-policy PPO trainers, and configured Ray resource pools.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .section { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 13px Arial, sans-serif; fill: #334155; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #475569; }
      .micro { font: 400 11px Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
      .blue { fill: #eff6ff; stroke: #2563eb; }
      .green { fill: #ecfdf5; stroke: #059669; }
      .amber { fill: #fffbeb; stroke: #d97706; }
      .violet { fill: #f5f3ff; stroke: #7c3aed; }
      .slate { fill: #f8fafc; stroke: #64748b; }
      .line { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .softline { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="820" fill="#ffffff"/>
  <text x="40" y="48" class="title">Uni-Agent Multi-Agent Training Design Overview</text>
  <text x="40" y="74" class="subtitle">Rollout-level credit assignment preserves Uni-Agent trajectories, then fans out advantage-annotated batches to resource-isolated policy trainers.</text>

  <rect x="40" y="110" width="360" height="580" class="box blue"/>
  <text x="66" y="146" class="section">MultiAgentsPPOTrainer</text>
  <text x="66" y="171" class="small">Multi-policy RL orchestration</text>

  <rect x="70" y="205" width="300" height="72" class="box"/>
  <text x="92" y="232" class="label">Prompt Batch</text>
  <text x="92" y="254" class="small">prompts with existing uid group key</text>

  <rect x="60" y="315" width="320" height="142" class="box"/>
  <text x="82" y="342" class="label">Policy Trainer Registry</text>
  <text x="82" y="366" class="micro">policy_1 -&gt; RayPPOTrainer -&gt; ray_resource_pool_1</text>
  <text x="82" y="388" class="micro">policy_2 -&gt; RayPPOTrainer -&gt; ray_resource_pool_2</text>
  <text x="82" y="410" class="micro">agent_1, agent_2 -&gt; policy_1; agent_3 -&gt; policy_2</text>
  <text x="82" y="434" class="micro">roles mapped to one policy share trainer and pool</text>

  <rect x="60" y="485" width="320" height="132" class="box"/>
  <text x="82" y="512" class="label">Per-Policy Updates</text>
  <text x="82" y="536" class="small">compute rollout_id -&gt; advantage</text>
  <text x="82" y="558" class="small">annotate per-policy DataProto</text>
  <text x="82" y="580" class="small">dispatch to RayPPOTrainer</text>
  <text x="82" y="602" class="small">skip/checkpoint each active policy</text>

  <rect x="460" y="110" width="360" height="580" class="box green"/>
  <text x="486" y="146" class="section">MultiAgentFramework</text>
  <text x="486" y="171" class="small">Implements AgentFramework.generate_sequences</text>
  <text x="486" y="191" class="tiny">Extends OpenAICompatibleAgentFramework lifecycle</text>

  <rect x="490" y="205" width="300" height="74" class="box"/>
  <text x="512" y="232" class="label">Grouped Rollout Expansion</text>
  <text x="512" y="254" class="small">uid -&gt; rollout.n samples</text>

  <rect x="490" y="310" width="300" height="102" class="box"/>
  <text x="512" y="337" class="label">MultiAgentRunner</text>
  <text x="512" y="361" class="small">launches external MAS</text>
  <text x="512" y="383" class="small">injects rollout base_url + role models</text>

  <rect x="490" y="445" width="300" height="126" class="box"/>
  <text x="512" y="472" class="label">Trajectory and Reward Pipeline</text>
  <text x="512" y="496" class="small">collect MultiAgentRolloutResult</text>
  <text x="512" y="518" class="small">framework assigns rollout reward</text>
  <text x="512" y="540" class="small">preserve rollout_id + group metadata</text>

  <rect x="490" y="605" width="300" height="58" class="box"/>
  <text x="512" y="631" class="label">MultiPolicyBatchBuilder</text>
  <text x="512" y="653" class="small">group by policy, preserve rollout metadata</text>

  <rect x="880" y="110" width="360" height="580" class="box amber"/>
  <text x="906" y="146" class="section">Serving Runtime</text>
  <text x="906" y="171" class="small">GatewayManager plus role-aware Gateway actors</text>

  <rect x="910" y="205" width="300" height="72" class="box"/>
  <text x="932" y="232" class="label">GatewayManager</text>
  <text x="932" y="254" class="small">assigns rollout groups across gateway_count</text>

  <rect x="910" y="315" width="300" height="126" class="box"/>
  <text x="932" y="342" class="label">RoleAwareGateway Actors</text>
  <text x="932" y="366" class="small">extract role from model=&lt;role&gt;</text>
  <text x="932" y="388" class="small">select role session in rollout group</text>
  <text x="932" y="410" class="small">resolve role -&gt; policy/backend</text>

  <rect x="910" y="480" width="300" height="102" class="box"/>
  <text x="932" y="507" class="label">RoleAwareRolloutBackend</text>
  <text x="932" y="531" class="small">policy -&gt; served model endpoint</text>
  <text x="932" y="553" class="small">returns token ids and logprobs</text>

  <rect x="910" y="615" width="300" height="48" class="box"/>
  <text x="932" y="644" class="label">Session-Level Trajectories</text>

  <rect x="460" y="720" width="780" height="58" class="box violet"/>
  <text x="486" y="746" class="label">External Multi-Agent System</text>
  <text x="486" y="768" class="small">All roles call the same rollout gateway base_url with model=&lt;role&gt;</text>

  <path d="M 370 241 L 490 241" class="line"/>
  <text x="398" y="226" class="tiny">rollout request</text>

  <path d="M 640 279 L 640 310" class="line"/>
  <path d="M 640 412 L 640 445" class="line"/>
  <path d="M 640 571 L 640 605" class="line"/>

  <path d="M 790 638 L 910 638" class="line"/>
  <text x="810" y="623" class="tiny">finalized role sessions</text>

  <path d="M 790 345 L 910 241" class="line"/>
  <text x="792" y="289" class="tiny">create/finalize rollout group</text>

  <path d="M 790 355 L 910 378" class="softline"/>
  <text x="805" y="386" class="tiny">MAS requests</text>

  <path d="M 1060 277 L 1060 315" class="line"/>
  <path d="M 1060 441 L 1060 480" class="line"/>
  <path d="M 1060 582 L 1060 615" class="line"/>

  <path d="M 910 531 L 400 371" class="softline"/>
  <text x="602" y="432" class="tiny">route generation to policy rollout server</text>

  <path d="M 490 634 L 370 548" class="line"/>
  <text x="386" y="597" class="tiny">rewarded policy batches</text>

  <path d="M 640 690 L 640 720" class="line"/>
  <path d="M 1060 690 L 1060 720" class="softline"/>
</svg>
