<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc">
  <title id="title">Uni-Agent Multi-Agent Training Design Overview (v2)</title>
  <desc id="desc">清晰版架构总览。三层架构：训练编排层（顶部）、执行框架层+Serving Runtime（中部左右分区）、外部MAS（底部）。带编号步骤和连接图例。</desc>

  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>

    <filter id="shadow1" x="-2%" y="-3%" width="104%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <filter id="shadow2" x="-1%" y="-2%" width="102%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <!-- 步骤编号圆圈模板 -->
    <g id="stepCircle">
      <circle cx="0" cy="0" r="12" fill="#1e293b"/>
      <text x="0" y="4" text-anchor="middle" font="700 12px Arial, sans-serif" fill="#ffffff"/>
    </g>

    <style>
      .title   { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .subtitle{ font: 400 13px Arial, sans-serif; fill: #475569; }
      .zoneHdr { font: 700 16px Arial, sans-serif; fill: #ffffff; }
      .zoneSub { font: 400 11px Arial, sans-serif; fill: #e2e8f0; }
      .boxHdr  { font: 700 13px Arial, sans-serif; fill: #0f172a; }
      .boxTxt  { font: 400 12px Arial, sans-serif; fill: #334155; }
      .boxFine { font: 400 11px Arial, sans-serif; fill: #475569; }
      .stepLbl { font: 400 12px Arial, sans-serif; fill: #1e293b; }
      .legendHdr{font: 700 13px Arial, sans-serif; fill: #0f172a; }
      .legendTxt{font: 400 11px Arial, sans-serif; fill: #475569; }
      .masTitle{ font: 700 15px Arial, sans-serif; fill: #6d28d9; }
      .masText { font: 400 12px Arial, sans-serif; fill: #4c1d95; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1400" height="960" fill="#f8fafc"/>

  <!-- ================================================================ -->
  <!-- 标题 -->
  <!-- ================================================================ -->
  <text x="50" y="40" class="title">Uni-Agent 多智能体训练 — 架构总览</text>
  <text x="50" y="62" class="subtitle">三层架构协作完成多智能体黑盒 RL 训练。顶部编排层协调多 policy PPO 更新；中部左侧执行框架管理 rollout 生命周期；中部右侧 Serving Runtime 负责 role-aware 路由与轨迹记录；底部外部 MAS 保持独立运行。</text>

  <!-- ================================================================ -->
  <!-- ZONE 1：训练编排层（顶部，全宽） -->
  <!-- ================================================================ -->
  <rect x="40" y="85" width="1320" height="215" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" filter="url(#shadow1)"/>
  <rect x="40" y="85" width="1320" height="34" rx="12" fill="#2563eb"/>
  <rect x="40" y="103" width="1320" height="16" fill="#2563eb"/>
  <text x="55" y="108" class="zoneHdr">训练编排层 — MultiAgentsPPOTrainer</text>
  <text x="340" y="108" class="zoneSub">策略训练器注册 · grouped advantage 计算 · per-policy PPO update 分发 · checkpoint 协调</text>

  <!-- Prompt Batch -->
  <rect x="70" y="140" width="240" height="68" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#shadow1)"/>
  <text x="190" y="166" text-anchor="middle" class="boxHdr">Prompt Batch</text>
  <text x="190" y="185" text-anchor="middle" class="boxFine">带 uid group key 的 prompts</text>
  <text x="190" y="200" text-anchor="middle" class="boxFine">同一 uid → rollout.n 个样本</text>

  <!-- Policy Trainer Registry -->
  <rect x="360" y="140" width="500" height="68" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#shadow1)"/>
  <text x="610" y="164" text-anchor="middle" class="boxHdr">Policy Trainer Registry</text>
  <text x="610" y="183" text-anchor="middle" class="boxFine">unique(policy) → RayPPOTrainer → ray_resource_pool</text>
  <text x="610" y="199" text-anchor="middle" class="boxFine">agent_1, agent_2 → policy_1 | agent_3 → policy_2</text>

  <!-- Per-Policy Update Dispatch -->
  <rect x="910" y="140" width="420" height="68" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#shadow1)"/>
  <text x="1120" y="164" text-anchor="middle" class="boxHdr">Per-Policy Update Dispatch</text>
  <text x="1120" y="185" text-anchor="middle" class="boxFine">按 uid group 计算 rollout_id → advantage</text>
  <text x="1120" y="200" text-anchor="middle" class="boxFine">分发 advantage-annotated DataProto 到对应 trainer</text>

  <!-- RayPPOTrainer(policy_1) -->
  <rect x="70" y="228" width="590" height="52" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.4" filter="url(#shadow1)"/>
  <text x="365" y="250" text-anchor="middle" class="boxHdr">RayPPOTrainer(policy_1)</text>
  <text x="365" y="270" text-anchor="middle" class="boxFine">worker group → ray_resource_pool_1（agent_1、agent_2 共享此 trainer）</text>

  <!-- RayPPOTrainer(policy_2) -->
  <rect x="690" y="228" width="640" height="52" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.4" filter="url(#shadow1)"/>
  <text x="1010" y="250" text-anchor="middle" class="boxHdr">RayPPOTrainer(policy_2)</text>
  <text x="1010" y="270" text-anchor="middle" class="boxFine">worker group → ray_resource_pool_2（仅 agent_3 使用，独立资源池）</text>

  <!-- ================================================================ -->
  <!-- ZONE 2：执行框架层（中部左侧） -->
  <!-- ================================================================ -->
  <rect x="40" y="320" width="700" height="305" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#shadow1)"/>
  <rect x="40" y="320" width="700" height="34" rx="12" fill="#059669"/>
  <rect x="40" y="340" width="700" height="14" fill="#059669"/>
  <text x="55" y="343" class="zoneHdr">执行框架层 — MultiAgentFramework</text>
  <text x="330" y="343" class="zoneSub">实现 generate_sequences(prompts) · 协调 rollout → runner → reward → batch</text>

  <!-- Grouped Rollout Expansion -->
  <rect x="65" y="375" width="275" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#shadow1)"/>
  <text x="202" y="400" text-anchor="middle" class="boxHdr">Grouped Rollout Expansion</text>
  <text x="202" y="420" text-anchor="middle" class="boxFine">uid → rollout.n 个独立 MAS 执行</text>

  <!-- Trajectory & Reward Pipeline -->
  <rect x="65" y="458" width="275" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#shadow1)"/>
  <text x="202" y="482" text-anchor="middle" class="boxHdr">Trajectory &amp; Reward Pipeline</text>
  <text x="202" y="501" text-anchor="middle" class="boxFine">收集 MultiAgentRolloutResult</text>
  <text x="202" y="518" text-anchor="middle" class="boxFine">RewardWorker 计算 rollout reward</text>
  <text x="202" y="535" text-anchor="middle" class="boxFine">附加 reward + group metadata</text>

  <!-- MultiAgentRunner -->
  <rect x="380" y="375" width="330" height="168" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#shadow1)"/>
  <text x="545" y="400" text-anchor="middle" class="boxHdr">MultiAgentRunner</text>
  <line x1="395" y1="412" x2="695" y2="412" stroke="#e2e8f0" stroke-width="1"/>
  <text x="545" y="433" text-anchor="middle" class="boxFine">① 加载 MAS config（定义 agent roles、tools）</text>
  <text x="545" y="452" text-anchor="middle" class="boxFine">② 注入 rollout-scoped gateway base_url</text>
  <text x="545" y="471" text-anchor="middle" class="boxFine">③ 设 model name = role name（model=&lt;role&gt;）</text>
  <text x="545" y="490" text-anchor="middle" class="boxFine">④ 启动外部 MAS → 等待 rollout 完成</text>
  <text x="545" y="509" text-anchor="middle" class="boxFine">⑤ 返回 final_result + reward_info</text>
  <text x="545" y="532" text-anchor="middle" class="boxFine" fill="#7c3aed">▼ 支持 in-process / Ray worker / sandbox / sidecar ▼</text>

  <!-- MultiPolicyBatchBuilder -->
  <rect x="65" y="565" width="645" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#shadow1)"/>
  <text x="387" y="591" text-anchor="middle" class="boxHdr">MultiPolicyBatchBuilder — 按 policy_name 分组 trajectory records → 输出 policy_name → DataProto</text>

  <!-- ================================================================ -->
  <!-- ZONE 3：Serving Runtime（中部右侧） -->
  <!-- ================================================================ -->
  <rect x="760" y="320" width="600" height="305" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.6" filter="url(#shadow1)"/>
  <rect x="760" y="320" width="600" height="34" rx="12" fill="#d97706"/>
  <rect x="760" y="340" width="600" height="14" fill="#d97706"/>
  <text x="775" y="343" class="zoneHdr">服务运行时层 — Gateway + Rollout Backend</text>
  <text x="1030" y="343" class="zoneSub">OpenAI-compatible API · role 路由 · trajectory 记录</text>

  <!-- GatewayManager -->
  <rect x="785" y="375" width="250" height="68" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#shadow1)"/>
  <text x="910" y="400" text-anchor="middle" class="boxHdr">GatewayManager</text>
  <text x="910" y="420" text-anchor="middle" class="boxFine">rollout-level actor affinity</text>
  <text x="910" y="437" text-anchor="middle" class="boxFine">跨 gateway_count 分配 rollout groups</text>

  <!-- RoleAwareRolloutBackend -->
  <rect x="1070" y="375" width="260" height="68" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#shadow1)"/>
  <text x="1200" y="400" text-anchor="middle" class="boxHdr">RoleAwareRolloutBackend</text>
  <text x="1200" y="420" text-anchor="middle" class="boxFine">policy → served model endpoint</text>

  <!-- RoleAwareGateway Actors -->
  <rect x="785" y="458" width="545" height="97" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#shadow1)"/>
  <text x="1057" y="482" text-anchor="middle" class="boxHdr">RoleAwareGateway Actors</text>
  <line x1="800" y1="494" x2="1315" y2="494" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1057" y="513" text-anchor="middle" class="boxFine">从 request model=&lt;role&gt; 提取 role → 在 rollout manifest 中选择 role session</text>
  <text x="1057" y="531" text-anchor="middle" class="boxFine">resolve role → policy → rollout backend · 复用 full/incremental encoding 记录轨迹</text>
  <text x="1057" y="549" text-anchor="middle" class="boxFine">持有 Rollout Session Group Manifest（rollout_id → role_sessions）</text>

  <!-- Session Trajectories -->
  <rect x="775" y="575" width="565" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="1057" y="596" text-anchor="middle" class="boxFine">Trajectory 字段: prompt_ids · response_ids · response_mask · logprobs · role · policy · rollout_id</text>

  <!-- ================================================================ -->
  <!-- 外部 MAS（底部，跨 Zone 2+3 下方） -->
  <!-- ================================================================ -->
  <rect x="210" y="665" width="980" height="72" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.2" filter="url(#shadow2)"/>
  <text x="700" y="694" text-anchor="middle" class="masTitle">External Multi-Agent System（外部多智能体系统）</text>
  <text x="700" y="718" text-anchor="middle" class="masText">作为独立应用运行。所有 agent role 共享同一个 rollout-scoped gateway base_url，通过 model=&lt;role&gt; 区分角色。</text>
  <text x="700" y="733" text-anchor="middle" class="boxFine">MAS 内部可为层级双层循环（orchestrator → worker agents），对 Uni-Agent 暴露为 agent_1, agent_2, ... agent_n</text>

  <!-- ================================================================ -->
  <!-- 图例 -->
  <!-- ================================================================ -->
  <rect x="40" y="770" width="220" height="105" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#shadow1)"/>
  <text x="55" y="792" class="legendHdr">连接图例</text>
  <line x1="55" y1="810" x2="100" y2="810" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="108" y="814" class="legendTxt">训练编排 / 批次流</text>
  <line x1="55" y1="830" x2="100" y2="830" stroke="#059669" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <text x="108" y="834" class="legendTxt">数据 / 轨迹流</text>
  <line x1="55" y1="850" x2="100" y2="850" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrAmber)"/>
  <text x="108" y="854" class="legendTxt">路由 / 生成请求</text>
  <line x1="55" y1="870" x2="100" y2="870" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrViolet)"/>
  <text x="108" y="874" class="legendTxt">MAS 启动 / 回调</text>

  <!-- ================================================================ -->
  <!-- 连接线 + 编号步骤 -->
  <!-- ================================================================ -->

  <!-- ── ① Trainer → Framework：下发 rollout 请求 ── -->
  <path d="M 310 174 L 360 174" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrBlue)"/>
  <use href="#stepCircle" x="335" y="174"/>
  <text x="335" y="179" text-anchor="middle" font="700 12px Arial, sans-serif" fill="#ffffff">①</text>
  <text x="320" y="160" text-anchor="middle" class="stepLbl" fill="#2563eb">generate_sequences</text>

  <!-- ── ② Registry → Rollout Expansion (跨层下行) ── -->
  <path d="M 450 208 L 202 375" stroke="#059669" stroke-width="2.2" fill="none" marker-end="url(#arrGreen)"/>
  <use href="#stepCircle" x="326" y="290"/>
  <text x="326" y="295" text-anchor="middle" font="700 12px Arial, sans-serif" fill="#ffffff">②</text>
  <text x="348" y="287" class="stepLbl" fill="#059669">展开 rollout.n</text>

  <!-- ── ③ Rollout → Runner ── -->
  <path d="M 340 406 L 380 430" stroke="#059669" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)"/>
  <use href="#stepCircle" x="362" y="420"/>
  <text x="362" y="425" text-anchor="middle" font="700 12px Arial, sans-serif" fill="#ffffff">③</text>

  <!-- ── ④ Framework/Runner → GatewayManager：创建 rollout ── -->
  <path d="M 710 406 L 785 406" stroke="#059669" stroke-width="2.2" fill="none" marker-end="url(#arrGreen)"/>
  <use href="#stepCircle" x="748" y="406"/>
  <text x="748" y="411" text-anchor="middle" font="700 12px Arial, sans-serif" fill="#ffffff">④</text>
  <text x="730" y="395" text-anchor="middle" class="stepLbl" fill="#059669">create rollout</text>

  <!-- ── ⑤ Runner → MAS：启动外部 MAS ── -->
  <path d="M 545 543 L 545 665" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrViolet)"/>
  <use href="#stepCircle" x="560" y="600"/>
  <text x="560" y="605" text-anchor="middle" font="700 12px Arial, sans-serif" fill="#ffffff">⑤</text>
  <text x="580" y="597" class="stepLbl" fill="#7c3aed">注入 base_url · 启动 MAS</text>

  <!-- ── ⑥ MAS → Gateway：回调 ── -->
  <path d="M 900 665 L 900 555" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrViolet)"/>
  <use href="#stepCircle" x="915" y="610"/>
  <text x="915" y="615" text-anchor="middle" font="700 12px Arial, sans-serif" fill="#ffffff">⑥</text>
  <text x="940" y="607" class="stepLbl" fill="#7c3aed">chat.completions(model=&lt;role&gt;)</text>

  <!-- ── ⑦ Gateway → Backend：路由 ── -->
  <path d="M 1200 555 L 1200 437" stroke="#d97706" stroke-width="2.2" fill="none" marker-end="url(#arrAmber)"/>
  <use href="#stepCircle" x="1215" y="495"/>
  <text x="1215" y="500" text-anchor="middle" font="700 12px Arial, sans-serif" fill="#ffffff">⑦</text>
  <text x="1235" y="487" class="stepLbl" fill="#d97706">role → policy</text>
  <text x="1235" y="502" class="stepLbl" fill="#d97706">→ backend</text>

  <!-- ── ⑧ Backend → Gateway：返回 token ── -->
  <path d="M 1200 437 L 1200 458" stroke="#d97706" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arrAmber)"/>
  <text x="1218" y="452" class="boxFine" fill="#d97706">token ids + logprobs</text>

  <!-- ── ⑨ Gateway → Framework：finalize rollout ── -->
  <path d="M 785 506 L 340 506" stroke="#059669" stroke-width="2.2" fill="none" marker-end="url(#arrGreen)"/>
  <use href="#stepCircle" x="560" y="506"/>
  <text x="560" y="511" text-anchor="middle" font="700 12px Arial, sans-serif" fill="#ffffff">⑨</text>
  <text x="580" y="495" class="stepLbl" fill="#059669">finalize → MultiAgentRolloutResult</text>

  <!-- ── ⑩ Trajectory → BatchBuilder ── -->
  <path d="M 202 543 L 202 565" stroke="#059669" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)"/>

  <!-- ── ⑪ BatchBuilder → Trainer ── -->
  <path d="M 710 586 L 750 586 L 750 174 L 910 174" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrBlue)"/>
  <use href="#stepCircle" x="750" y="380"/>
  <text x="750" y="385" text-anchor="middle" font="700 12px Arial, sans-serif" fill="#ffffff">⑪</text>
  <text x="770" y="372" class="stepLbl" fill="#2563eb">policy_name</text>
  <text x="770" y="387" class="stepLbl" fill="#2563eb">→ DataProto</text>

  <!-- ── ⑫ Trainer → RayPPOTrainers：分发更新 ── -->
  <path d="M 1120 208 L 1120 218 L 660 218 L 660 228" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#arrBlue)"/>
  <path d="M 1120 218 L 1010 228" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#arrBlue)"/>
  <use href="#stepCircle" x="890" y="218"/>
  <text x="890" y="223" text-anchor="middle" font="700 12px Arial, sans-serif" fill="#ffffff">⑫</text>
  <text x="920" y="210" class="stepLbl" fill="#2563eb">advantage-annotated batch → policy_1 / policy_2</text>

  <!-- ── 辅助：GatewayManager → Gateway Actor ── -->
  <path d="M 1035 437 L 1057 458" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrGray)"/>

  <!-- ── 辅助：Rollout 箭头（从 Registry 向右到 Per-Policy） ── -->
  <path d="M 860 174 L 910 174" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)"/>

</svg>
