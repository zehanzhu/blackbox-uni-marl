<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Hierarchical Two-Loop Multi-Agent Inference Process</title>
  <desc id="desc">A production-style hierarchical two-loop multi-agent system inference process using abstract agent roles. agent_1 may own outer orchestration, while agent_2 and agent_3 can run private ReAct inner loops and return only final summaries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .section { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 13px Arial, sans-serif; fill: #334155; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
      .blue { fill: #eff6ff; stroke: #2563eb; }
      .green { fill: #ecfdf5; stroke: #059669; }
      .amber { fill: #fffbeb; stroke: #d97706; }
      .slate { fill: #f8fafc; stroke: #64748b; }
      .line { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .softline { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); stroke-dasharray: 5 4; }
      .outerLoop { stroke: #2563eb; stroke-width: 1.9; fill: none; marker-end: url(#arrow); }
      .innerLoop { stroke: #059669; stroke-width: 1.9; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="760" fill="#ffffff"/>
  <text x="40" y="48" class="title">Hierarchical Two-Loop Multi-Agent Inference Process</text>
  <text x="40" y="74" class="subtitle">agent_1 may own global orchestration; agent_2 and agent_3 call selected models with base_url, model, and private messages.</text>

  <rect x="60" y="130" width="220" height="90" class="box amber"/>
  <text x="86" y="164" class="label">User Request</text>
  <text x="86" y="190" class="small">raw task requirement</text>

  <rect x="60" y="540" width="220" height="90" class="box amber"/>
  <text x="86" y="574" class="label">Final Answer</text>
  <text x="86" y="600" class="small">agent_1 summary</text>

  <rect x="335" y="115" width="390" height="540" class="box blue"/>
  <text x="365" y="152" class="section">agent_1 Outer Loop</text>
  <text x="365" y="178" class="small">private messages plus global task state</text>

  <rect x="370" y="215" width="320" height="58" class="box"/>
  <text x="392" y="249" class="label">1. Append user input</text>

  <rect x="370" y="300" width="320" height="76" class="box"/>
  <text x="392" y="329" class="label">2. Call agent_1 LLM</text>
  <text x="392" y="353" class="small">decompose, select agent, critique</text>

  <rect x="370" y="405" width="320" height="76" class="box"/>
  <text x="392" y="434" class="label">3. Dispatch agent task</text>
  <text x="392" y="458" class="small">spawn_agent(role, task instruction)</text>

  <rect x="370" y="510" width="320" height="76" class="box"/>
  <text x="392" y="539" class="label">4. Receive agent summary</text>
  <text x="392" y="563" class="small">update messages and global state</text>

  <path d="M 690 548 C 750 548 750 335 691 335" class="outerLoop"/>
  <text x="606" y="616" class="tiny">outer orchestration loop</text>

  <rect x="815" y="115" width="405" height="540" class="box green"/>
  <text x="845" y="152" class="section">Agent Inner ReAct Loops</text>
  <text x="845" y="178" class="small">multiple agents, each with model config and private messages</text>

  <rect x="850" y="215" width="100" height="72" class="box"/>
  <text x="868" y="238" class="label">agent_1</text>
  <text x="866" y="260" class="tiny">base_url_1</text>
  <text x="866" y="278" class="tiny">model_1</text>

  <rect x="968" y="215" width="100" height="72" class="box"/>
  <text x="986" y="238" class="label">agent_2</text>
  <text x="984" y="260" class="tiny">base_url_2</text>
  <text x="984" y="278" class="tiny">model_2</text>

  <rect x="1086" y="215" width="100" height="72" class="box"/>
  <text x="1104" y="238" class="label">agent_3</text>
  <text x="1102" y="260" class="tiny">base_url_3</text>
  <text x="1102" y="278" class="tiny">model_3</text>

  <rect x="850" y="320" width="335" height="58" class="box"/>
  <text x="872" y="354" class="label">A. Append agent instruction</text>

  <rect x="850" y="405" width="335" height="76" class="box"/>
  <text x="872" y="434" class="label">B. Call selected agent LLM</text>
  <text x="872" y="458" class="small">base_url + model + private messages</text>

  <rect x="850" y="510" width="335" height="76" class="box"/>
  <text x="872" y="539" class="label">C. Execute tools if needed</text>
  <text x="872" y="563" class="small">tool messages remain private</text>

  <rect x="850" y="615" width="335" height="32" class="box"/>
  <text x="872" y="637" class="label">D. Return final summary only</text>

  <path d="M 1185 548 C 1236 548 1236 443 1186 443" class="innerLoop"/>
  <text x="1092" y="499" class="tiny">inner ReAct loop</text>

  <path d="M 280 175 L 370 244" class="line"/>
  <path d="M 690 443 L 850 251" class="line"/>
  <text x="718" y="356" class="tiny">task to selected agent</text>
  <path d="M 850 631 L 690 548" class="line"/>
  <text x="710" y="604" class="tiny">final summary text</text>
  <path d="M 370 548 L 280 585" class="line"/>

  <rect x="335" y="680" width="885" height="58" class="box slate"/>
  <text x="365" y="705" class="small">Inference boundary: tool traces and intermediate messages stay inside each agent session.</text>
  <text x="365" y="725" class="small">Only final summaries cross back to the orchestrating agent loop.</text>
</svg>
