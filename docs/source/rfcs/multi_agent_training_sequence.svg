<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1460" viewBox="0 0 1500 1460" role="img" aria-labelledby="title desc">
  <title id="title">Multi-Agent RL Training Sequence</title>
  <desc id="desc">RFC-style sequence diagram showing multi-agent rollout setup, repeated MAS role invocations, rollout-level finalization, reward assignment, batch building, and fan-out to multiple per-policy RayPPOTrainer instances.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="replyArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .participant { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; rx: 8; }
      .participantText { font: 700 12px Arial, sans-serif; fill: #0f172a; }
      .lifeline { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 6 6; }
      .line { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .reply { stroke: #64748b; stroke-width: 1.4; fill: none; marker-end: url(#replyArrow); stroke-dasharray: 5 4; }
      .self { stroke: #334155; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .label { font: 400 12px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 11px Arial, sans-serif; fill: #334155; }
      .phase { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 8; }
      .loop { fill: #ecfdf5; stroke: #059669; stroke-width: 1.2; stroke-dasharray: 7 5; rx: 8; }
      .phaseLabel { font: 700 13px Arial, sans-serif; fill: #334155; }
      .loopLabel { font: 700 12px Arial, sans-serif; fill: #047857; }
      .trainerBox { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.2; rx: 7; }
      .poolBox { fill: #f0fdfa; stroke: #0f766e; stroke-width: 1.2; rx: 7; }
      .noteBox { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.1; rx: 7; }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="1460" fill="#ffffff"/>
  <text x="40" y="48" class="title">Multi-Agent RL Training Sequence</text>
  <text x="40" y="74" class="subtitle">The sequence emphasizes public rollout-level APIs and component boundaries; session-level details stay inside the owning GatewayActor.</text>

  <!-- Participant boxes -->
  <rect x="25" y="105" width="110" height="54" class="participant"/>
  <text x="80" y="128" text-anchor="middle" class="participantText">MultiAgents</text>
  <text x="80" y="145" text-anchor="middle" class="participantText">PPOTrainer</text>

  <rect x="165" y="105" width="110" height="54" class="participant"/>
  <text x="220" y="128" text-anchor="middle" class="participantText">MultiAgent</text>
  <text x="220" y="145" text-anchor="middle" class="participantText">Framework</text>

  <rect x="305" y="105" width="110" height="54" class="participant"/>
  <text x="360" y="128" text-anchor="middle" class="participantText">Gateway</text>
  <text x="360" y="145" text-anchor="middle" class="participantText">Manager</text>

  <rect x="445" y="105" width="110" height="54" class="participant"/>
  <text x="500" y="128" text-anchor="middle" class="participantText">Gateway</text>
  <text x="500" y="145" text-anchor="middle" class="participantText">Actor</text>

  <rect x="585" y="105" width="110" height="54" class="participant"/>
  <text x="640" y="128" text-anchor="middle" class="participantText">MultiAgent</text>
  <text x="640" y="145" text-anchor="middle" class="participantText">Runner</text>

  <rect x="725" y="105" width="110" height="54" class="participant"/>
  <text x="780" y="128" text-anchor="middle" class="participantText">External</text>
  <text x="780" y="145" text-anchor="middle" class="participantText">MAS</text>

  <rect x="865" y="105" width="110" height="54" class="participant"/>
  <text x="920" y="128" text-anchor="middle" class="participantText">Rollout</text>
  <text x="920" y="145" text-anchor="middle" class="participantText">Backend</text>

  <rect x="1005" y="105" width="110" height="54" class="participant"/>
  <text x="1060" y="122" text-anchor="middle" class="participantText">Per-policy</text>
  <text x="1060" y="138" text-anchor="middle" class="participantText">RayPPO</text>
  <text x="1060" y="153" text-anchor="middle" class="participantText">Trainers</text>

  <rect x="1145" y="105" width="110" height="54" class="participant"/>
  <text x="1200" y="128" text-anchor="middle" class="participantText">Reward</text>
  <text x="1200" y="145" text-anchor="middle" class="participantText">Provider</text>

  <rect x="1285" y="105" width="110" height="54" class="participant"/>
  <text x="1340" y="128" text-anchor="middle" class="participantText">Batch</text>
  <text x="1340" y="145" text-anchor="middle" class="participantText">Builder</text>

  <!-- Lifelines -->
  <line x1="80" y1="159" x2="80" y2="1440" class="lifeline"/>
  <line x1="220" y1="159" x2="220" y2="1440" class="lifeline"/>
  <line x1="360" y1="159" x2="360" y2="1440" class="lifeline"/>
  <line x1="500" y1="159" x2="500" y2="1440" class="lifeline"/>
  <line x1="640" y1="159" x2="640" y2="1440" class="lifeline"/>
  <line x1="780" y1="159" x2="780" y2="1440" class="lifeline"/>
  <line x1="920" y1="159" x2="920" y2="1440" class="lifeline"/>
  <line x1="1060" y1="159" x2="1060" y2="1440" class="lifeline"/>
  <line x1="1200" y1="159" x2="1200" y2="1440" class="lifeline"/>
  <line x1="1340" y1="159" x2="1340" y2="1440" class="lifeline"/>

  <!-- Phase 1 -->
  <rect x="40" y="185" width="1420" height="210" class="phase"/>
  <text x="58" y="210" class="phaseLabel">1. Rollout Setup</text>

  <line x1="80" y1="240" x2="220" y2="240" class="line"/>
  <text x="102" y="232" class="label">generate_sequences(prompts)</text>

  <path d="M 220 270 C 275 270 275 298 221 298" class="self"/>
  <text x="285" y="288" class="label">expand prompt into rollout.n samples</text>

  <line x1="220" y1="330" x2="360" y2="330" class="line"/>
  <text x="238" y="322" class="label">create_multi_agent_rollout(rollout_id, roles)</text>

  <line x1="360" y1="365" x2="500" y2="365" class="line"/>
  <text x="374" y="357" class="label">assign rollout_id to GatewayActor</text>

  <!-- Phase 2 -->
  <rect x="40" y="420" width="1420" height="385" class="phase"/>
  <text x="58" y="445" class="phaseLabel">2. MAS Execution Loop</text>

  <line x1="500" y1="475" x2="220" y2="475" class="reply"/>
  <text x="275" y="467" class="label">MultiAgentRolloutHandle(base_url, role_models)</text>

  <line x1="220" y1="510" x2="640" y2="510" class="line"/>
  <text x="338" y="502" class="label">launch MAS(handle)</text>

  <line x1="640" y1="545" x2="780" y2="545" class="line"/>
  <text x="684" y="537" class="label">start MAS</text>

  <rect x="450" y="570" width="650" height="225" class="loop"/>
  <text x="466" y="592" class="loopLabel">loop role invocation until the MAS finishes</text>

  <line x1="780" y1="615" x2="500" y2="615" class="line"/>
  <text x="555" y="607" class="label">chat.completions(base_url, model=&lt;role&gt;)</text>

  <path d="M 500 640 C 555 640 555 668 501 668" class="self"/>
  <text x="565" y="658" class="label">select role session, encode incrementally</text>

  <line x1="500" y1="690" x2="920" y2="690" class="line"/>
  <text x="646" y="682" class="label">generate(policy, prompt_ids)</text>

  <line x1="920" y1="720" x2="1060" y2="720" class="line"/>
  <text x="942" y="712" class="label">policy rollout generation</text>

  <line x1="1060" y1="750" x2="500" y2="750" class="reply"/>
  <text x="705" y="742" class="label">completion tokens and logprobs</text>

  <line x1="500" y1="780" x2="780" y2="780" class="reply"/>
  <text x="558" y="772" class="label">OpenAI-compatible response</text>

  <!-- Phase 3 -->
  <rect x="40" y="830" width="1420" height="220" class="phase"/>
  <text x="58" y="855" class="phaseLabel">3. Rollout Finalization</text>

  <line x1="780" y1="875" x2="640" y2="875" class="reply"/>
  <text x="672" y="867" class="label">final MAS result</text>

  <line x1="640" y1="905" x2="220" y2="905" class="reply"/>
  <text x="350" y="897" class="label">final_result + metadata</text>

  <line x1="220" y1="935" x2="360" y2="935" class="line"/>
  <text x="236" y="927" class="label">finalize_multi_agent_rollout(rollout_id)</text>

  <line x1="360" y1="965" x2="500" y2="965" class="line"/>
  <text x="374" y="957" class="label">finalize rollout session group</text>

  <path d="M 500 990 C 555 990 555 1010 501 1010" class="self"/>
  <text x="565" y="1005" class="label">materialize all role-session trajectories</text>

  <line x1="500" y1="1035" x2="220" y2="1035" class="reply"/>
  <text x="286" y="1027" class="label">MultiAgentRolloutResult</text>

  <!-- Phase 4 -->
  <rect x="40" y="1060" width="1420" height="355" class="phase"/>
  <text x="58" y="1085" class="phaseLabel">4. Reward, Batches, and Policy Updates</text>

  <line x1="220" y1="1115" x2="1200" y2="1115" class="line"/>
  <text x="628" y="1107" class="label">compute_score(reward_input)</text>

  <line x1="1200" y1="1145" x2="220" y2="1145" class="reply"/>
  <text x="655" y="1137" class="label">reward_i and extra_info</text>

  <path d="M 220 1175 C 275 1175 275 1198 221 1198" class="self"/>
  <text x="285" y="1192" class="label">attach rollout reward and group metadata</text>

  <line x1="220" y1="1220" x2="1340" y2="1220" class="line"/>
  <text x="680" y="1212" class="label">build policy_name -&gt; DataProto</text>

  <line x1="1340" y1="1248" x2="80" y2="1248" class="reply"/>
  <text x="590" y="1240" class="label">policy_name -&gt; DataProto map with reward/group metadata</text>

  <path d="M 80 1275 C 135 1275 135 1298 81 1298" class="self"/>
  <text x="145" y="1292" class="label">compute rollout_id -&gt; advantage, then dispatch by policy registry</text>

  <rect x="990" y="1268" width="170" height="34" class="trainerBox"/>
  <text x="1075" y="1290" text-anchor="middle" class="small">RayPPOTrainer(policy_1)</text>
  <rect x="1180" y="1268" width="150" height="34" class="poolBox"/>
  <text x="1255" y="1290" text-anchor="middle" class="small">ray_resource_pool_1</text>
  <line x1="80" y1="1285" x2="990" y2="1285" class="line"/>
  <text x="380" y="1277" class="label">policy_1 advantage-annotated DataProto</text>
  <line x1="1160" y1="1285" x2="1180" y2="1285" class="line"/>

  <rect x="990" y="1315" width="170" height="34" class="trainerBox"/>
  <text x="1075" y="1337" text-anchor="middle" class="small">RayPPOTrainer(policy_2)</text>
  <rect x="1180" y="1315" width="150" height="34" class="poolBox"/>
  <text x="1255" y="1337" text-anchor="middle" class="small">ray_resource_pool_2</text>
  <line x1="80" y1="1332" x2="990" y2="1332" class="line"/>
  <text x="380" y="1324" class="label">policy_2 advantage-annotated DataProto</text>
  <line x1="1160" y1="1332" x2="1180" y2="1332" class="line"/>

  <rect x="170" y="1370" width="760" height="24" class="noteBox"/>
  <text x="186" y="1386" class="small">Roles mapped to one policy share one RayPPOTrainer; policies without batches skip this update step.</text>
</svg>
