<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Grouped Multi-Agent GRPO Flow</title>
  <desc id="desc">Data flow diagram showing one prompt expanded into multiple multi-agent rollouts, each rollout containing role sessions, one final result, one reward, trainer-side rollout advantage assignment, and per-policy batch construction.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .label { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 13px Arial, sans-serif; fill: #334155; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
      .blue { fill: #eff6ff; stroke: #2563eb; }
      .green { fill: #ecfdf5; stroke: #059669; }
      .amber { fill: #fffbeb; stroke: #d97706; }
      .red { fill: #fef2f2; stroke: #dc2626; }
      .violet { fill: #f5f3ff; stroke: #7c3aed; }
      .slate { fill: #f8fafc; stroke: #64748b; }
      .line { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .softline { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="900" fill="#ffffff"/>
  <text x="40" y="48" class="title">Grouped Multi-Agent GRPO Flow</text>
  <text x="40" y="74" class="subtitle">rollout.n creates independent MAS executions; MultiAgentsPPOTrainer computes rollout-level advantages before per-policy updates.</text>

  <rect x="480" y="105" width="320" height="72" class="box blue"/>
  <text x="512" y="134" class="label">Dataset Prompt</text>
  <text x="512" y="157" class="small">uid groups rollout.n samples</text>

  <rect x="65" y="235" width="330" height="335" class="box green"/>
  <text x="92" y="265" class="label">rollout_0</text>
  <text x="92" y="288" class="small">sample_idx = 0</text>
  <rect x="95" y="318" width="270" height="52" class="box"/>
  <text x="115" y="348" class="small">agent_3 session -&gt; Trajectory[]</text>
  <rect x="95" y="390" width="270" height="52" class="box"/>
  <text x="115" y="420" class="small">agent_1 session -&gt; Trajectory[]</text>
  <rect x="95" y="462" width="270" height="52" class="box"/>
  <text x="115" y="492" class="small">agent_2 session -&gt; Trajectory[]</text>
  <text x="95" y="545" class="small">final_result_0 -&gt; reward_0</text>

  <rect x="475" y="235" width="330" height="335" class="box green"/>
  <text x="502" y="265" class="label">rollout_1</text>
  <text x="502" y="288" class="small">sample_idx = 1</text>
  <rect x="505" y="318" width="270" height="52" class="box"/>
  <text x="525" y="348" class="small">agent_3 session -&gt; Trajectory[]</text>
  <rect x="505" y="390" width="270" height="52" class="box"/>
  <text x="525" y="420" class="small">agent_1 session -&gt; Trajectory[]</text>
  <rect x="505" y="462" width="270" height="52" class="box"/>
  <text x="525" y="492" class="small">agent_2 session -&gt; Trajectory[]</text>
  <text x="505" y="545" class="small">final_result_1 -&gt; reward_1</text>

  <rect x="885" y="235" width="330" height="335" class="box green"/>
  <text x="912" y="265" class="label">rollout_n-1</text>
  <text x="912" y="288" class="small">sample_idx = n-1</text>
  <rect x="915" y="318" width="270" height="52" class="box"/>
  <text x="935" y="348" class="small">agent_3 session -&gt; Trajectory[]</text>
  <rect x="915" y="390" width="270" height="52" class="box"/>
  <text x="935" y="420" class="small">agent_1 session -&gt; Trajectory[]</text>
  <rect x="915" y="462" width="270" height="52" class="box"/>
  <text x="935" y="492" class="small">agent_2 session -&gt; Trajectory[]</text>
  <text x="915" y="545" class="small">final_result_n-1 -&gt; reward_n-1</text>

  <text x="820" y="400" class="label">...</text>

  <rect x="330" y="635" width="620" height="72" class="box amber"/>
  <text x="362" y="664" class="label">MultiAgentsPPOTrainer Advantage Assignment</text>
  <text x="362" y="687" class="small">rollout_id -&gt; advantage = group_advantages([reward_0, reward_1, ..., reward_n-1])</text>

  <rect x="65" y="755" width="330" height="70" class="box red"/>
  <text x="92" y="784" class="label">Attach advantage_0</text>
  <text x="92" y="807" class="small">all per-policy records from rollout_0</text>

  <rect x="475" y="755" width="330" height="70" class="box red"/>
  <text x="502" y="784" class="label">Attach advantage_1</text>
  <text x="502" y="807" class="small">all per-policy records from rollout_1</text>

  <rect x="885" y="755" width="330" height="70" class="box red"/>
  <text x="912" y="784" class="label">Attach advantage_n-1</text>
  <text x="912" y="807" class="small">all per-policy records from rollout_n-1</text>

  <rect x="330" y="850" width="620" height="34" class="box violet"/>
  <text x="362" y="872" class="small">Group by policy_name -&gt; attach rollout advantage -&gt; RayPPOTrainer(policy_name)</text>

  <path d="M 640 177 L 230 235" class="line"/>
  <path d="M 640 177 L 640 235" class="line"/>
  <path d="M 640 177 L 1050 235" class="line"/>
  <text x="700" y="216" class="tiny">rollout.n independent samples</text>

  <path d="M 230 570 L 460 635" class="line"/>
  <path d="M 640 570 L 640 635" class="line"/>
  <path d="M 1050 570 L 820 635" class="line"/>

  <path d="M 455 707 L 230 755" class="line"/>
  <path d="M 640 707 L 640 755" class="line"/>
  <path d="M 825 707 L 1050 755" class="line"/>

  <path d="M 230 825 L 455 850" class="line"/>
  <path d="M 640 825 L 640 850" class="line"/>
  <path d="M 1050 825 L 825 850" class="line"/>
</svg>
